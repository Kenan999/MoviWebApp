{% extends "base.html" %}
{% block content %}

<h1>Users</h1>

<div class="card">
    {% if users %}
    <ul class="user-list">
        {% for user in users %}
        <li class="user-entry">
            <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn">{{ user.name }}</a>
            <a href="{{ url_for('edit_user', user_id=user.id) }}" class="btn btn-edit">Edit</a>
            <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('Delete user {{ user.name }}?')" style="display:inline">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="empty-state">No users yet.</div>
    {% endif %}
</div>

<h3>Add User</h3>
<div class="card">
    <form class="add-user-form" action="{{ url_for('create_user') }}" method="POST">
        <input type="text" name="name" placeholder="Enter name" required>
        <button type="submit" class="btn btn-add">Add User</button>
    </form>
</div>

{% endblock %}
